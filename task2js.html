  <body>
    <script>
      let marck = Number(prompt("Enter marck"));
      if (marck >= 90) {
        console.log("A+");
      } else if (marck >= 80) {
        console.log("A");
      } else if (marck >= 70) {
        console.log("B");
      } else if (marck >= 50) {
        console.log("C");
      } else {
        console.log("F");
      }
    </script>
